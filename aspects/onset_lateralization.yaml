name: onset_lateralization
description: Where does rhythmic activity first appear, and does it stay focal or spread.
version: "0.1"
trigger:
  when: candidate
  sources_any: ["annotation:Seizure", "annotation:seizure", "button"]
  min_core_duration_s: 5
needs:
  channels: all
  montage: bipolar_longitudinal
  features: [bp_theta, bp_alpha, bp_beta, line_length]
  window: core
claim_types: [onset_region, onset_time, spread_pattern]
prompt_file: prompts/onset_lateralization.md
max_scope_calls: 8
